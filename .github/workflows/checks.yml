name: CI

# Verification for every PR and every push to main.
# Deploys are handled by the Vercel GitHub integration; this workflow only verifies.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is only needed so Prisma's CLI works; Bun runs everything else.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          # Dummy values - the production build needs them to exist at build/collection time,
          # but nothing in CI actually connects to anything.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/codeturtle
          GITHUB_CLIENT_ID: ci-dummy-client-id
          GITHUB_CLIENT_SECRET: ci-dummy-client-secret
          GITHUB_APP_ID: ci-dummy-app-id
          GITHUB_APP_PRIVATE_KEY: ci-dummy-private-key
          BETTER_AUTH_SECRET: ci-dummy-secret-key-with-at-least-32-characters
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          BETTER_AUTH_URL: http://localhost:3000
